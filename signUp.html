<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Sign up</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="signup-page">
      <img
        class="signup-page-logo"
        src="./assets/img/join_logo.svg"
        alt="Join"
      />

      <section class="signup-card">
        <a
          class="signup-back-button"
          href="./index.html"
          aria-label="Back to log in"
        >
          <img src="./assets/icons/arrow.svg" alt="" aria-hidden="true" />
        </a>

        <div class="signup-dialog-heading">
          <h1 class="signup-heading" id="signUpTitle">Sign up</h1>
          <span class="heading-line" aria-hidden="true"></span>
        </div>

        <form class="signup-form" id="signUpForm" novalidate>
          <div class="component-input">
            <label class="sr-only" for="signUpName">Name</label>
            <input
              id="signUpName"
              type="text"
              placeholder="Name"
              data-required
            />
            <img src="./assets/icons/person.svg" alt="" aria-hidden="true" />
            <span class="field-error" id="signUpNameError"></span>
          </div>

          <div class="component-input">
            <label class="sr-only" for="signUpEmail">Email</label>
            <input
              id="signUpEmail"
              type="email"
              placeholder="Email"
              data-required
            />
            <img src="./assets/icons/mail.svg" alt="" aria-hidden="true" />
            <span class="field-error" id="signUpEmailError"></span>
          </div>

          <div class="component-input">
            <label class="sr-only" for="signUpPassword">Password</label>
            <input
              id="signUpPassword"
              type="password"
              placeholder="Password"
              data-required
            />
            <button
              class="password-toggle"
              type="button"
              data-password-toggle
              data-target="signUpPassword"
              aria-label="Show password"
            >
              <img src="./assets/icons/lock.svg" alt="" aria-hidden="true" />
            </button>
            <span class="field-error" id="signUpPasswordError"></span>
          </div>

          <div class="component-input">
            <label class="sr-only" for="repeatPassword">Confirm Password</label>
            <input
              id="repeatPassword"
              type="password"
              placeholder="Confirm Password"
              data-required
            />
            <button
              class="password-toggle"
              type="button"
              data-password-toggle
              data-target="repeatPassword"
              aria-label="Show password"
            >
              <img src="./assets/icons/lock.svg" alt="" aria-hidden="true" />
            </button>
            <span class="field-error" id="repeatPasswordError"></span>
          </div>

          <label class="privacy-check" for="privacyAccepted">
            <input id="privacyAccepted" type="checkbox" />
            <img
              class="privacy-checkbox-icon"
              id="privacyCheckboxIcon"
              src="./assets/icons/checkbox.svg"
              alt=""
              aria-hidden="true"
            />
            <span
              >I accept the
              <a href="./privacyPolicy.html">Privacy policy</a></span
            >
          </label>

          <p class="form-message" id="signUpMessage" aria-live="polite"></p>
          <button
            class="btn btn--primary"
            id="registerButton"
            type="submit"
            disabled
          >
            Sign up
          </button>
        </form>
      </section>

      <footer class="signup-footer">
        <a href="./privacyPolicy.html">Privacy Policy</a>
        <a href="./legalNotice.html">Legal notice</a>
      </footer>

      <div class="component-toast" id="appToast" hidden aria-live="polite"></div>
    </main>

    <script src="./scripts/common.js"></script>
    <script src="./scripts/overlays.js"></script>
    <script src="./scripts/firebaseConfig.js"></script>
    <script src="./scripts/dataService.js"></script>
    <script src="./scripts/avatarColors.js"></script>
    <script src="./scripts/signUp.js"></script>
  </body>
</html>
