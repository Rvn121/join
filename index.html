<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-frame">
      <header class="site-header">
        <div class="content-width header-content">
          <div class="signup-area" aria-label="Registrierung">
            <span>Not a Join user?</span>
            <a class="btn btn--primary btn--sm" href="./signUp.html">Sign up</a>
          </div>
        </div>
      </header>

      <main class="site-main">
        <img class="join-logo join-logo--dark" src="./assets/img/join_logo.svg" alt="Join" />
        <img class="join-logo join-logo--light" src="./assets/img/join_logo_white.svg" alt="" aria-hidden="true" />

        <dialog
          class="login-dialog"
          id="loginDialog"
          aria-labelledby="loginTitle"
        >
          <form class="login-form" id="loginForm" novalidate>
            <div class="login-heading">
              <h1 id="loginTitle">Log in</h1>
              <span class="heading-line" aria-hidden="true"></span>
            </div>

            <div class="component-input">
              <label class="sr-only" for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
              />
              <img src="./assets/icons/mail.svg" alt="" aria-hidden="true" />
            </div>

            <div class="component-input">
              <label class="sr-only" for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                data-target="password"
                aria-label="Show password"
              >
                <img src="./assets/icons/lock.svg" alt="" aria-hidden="true" />
              </button>
            </div>

            <p class="form-message" id="loginMessage" aria-live="polite"></p>

            <div class="login-actions">
              <button class="btn btn--primary" id="loginButton" type="submit">
                Log in
              </button>
              <button
                class="btn btn--secondary"
                id="guestLoginButton"
                type="button"
              >
                Guest Log in
              </button>
            </div>
          </form>
        </dialog>


        <div class="component-toast" id="appToast" hidden aria-live="polite"></div>
      </main>

      <footer class="site-footer">
        <div class="content-width footer-content">
          <a href="./privacyPolicy.html">Privacy Policy</a>
          <a href="./legalNotice.html">Legal notice</a>
        </div>
      </footer>
    </div>

    <script src="./scripts/common.js"></script>
    <script src="./scripts/overlays.js"></script>
    <script src="./scripts/firebaseConfig.js"></script>
    <script src="./scripts/dataService.js"></script>
    <script src="./scripts/dataServiceRelations.js"></script>
    <script src="./scripts/avatarColors.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
