<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Join</title>
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <link rel="stylesheet" href="./style.css"/>
  </head>
  <body>
    <div class="page-frame">
      <header class="site-header">
        <div class="content-width header-content">
          <div class="signup-area" aria-label="Registrierung">
            <span>Not a Join user?</span>
            <button class="button button-dark button-signup" type="button">Sign up</button>
          </div>
        </div>
      </header>
      
      <main class="site-main">
        <h1>
        <img
          class="join-logo"
          src="./assets/img/join_logo.png"
          alt="Join"
        />
        </h1>

        <dialog class="login-dialog" id="loginDialog" aria-labelledby="loginTitle">
          <form class="login-form" id="loginForm">
            <div class="login-heading">
              <h2 id="loginTitle">Log in</h2>
              <span class="heading-line" aria-hidden="true"></span>
            </div>

            <div class="input-group">
              <label class="sr-only" for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
              />
              <img
                class="input-icon"
                src="./assets/icons/mail.png"
                alt=""
                aria-hidden="true"
              />
            </div>

            <div class="input-group">
              <label class="sr-only" for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
              />
              <img
                class="input-icon"
                src="./assets/icons/lock.png"
                alt=""
                aria-hidden="true"
              />
            </div>

            <div class="login-actions">
              <button class="button button-dark" type="submit">Log in</button>
              <button class="button button-light" id="guestLoginButton" type="button">Guest Log in</button>
            </div>
          </form>
        </dialog>
      </main>

      <footer class="site-footer">
        <div class="content-width footer-content">
          <a href="./app.html#privacy">Privacy Policy</a>
          <a href="./app.html#legal">Legal notice</a>
        </div>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
